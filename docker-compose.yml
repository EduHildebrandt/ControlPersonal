services:
  db:
    image: postgres:16-alpine
    container_name: control_personal_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-turnomaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TuContrasenaSegura2026!}
      POSTGRES_DB: ${POSTGRES_DB:-turnomaster_db}
    ports:
      # Expuesto solo internamente en el host (127.0.0.1) para seguridad
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turnomaster} -d ${POSTGRES_DB:-turnomaster_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: control_personal_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-turnomaster}:${POSTGRES_PASSWORD:-TuContrasenaSegura2026!}@db:5432/${POSTGRES_DB:-turnomaster_db}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-turnomaster}:${POSTGRES_PASSWORD:-TuContrasenaSegura2026!}@db:5432/${POSTGRES_DB:-turnomaster_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-jwt-secret-produccion-turnomaster-2026}
      NODE_ENV: production
      PORT: 3000
    ports:
      # Puerto de acceso web (3000 o mapeado a 80)
      - "${APP_PORT:-3000}:3000"
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge
